name: ci

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=LanguageLearningDb;User Id=sa;Password=StrongPwd123!;TrustServerCertificate=True;"
      Jwt__Issuer: "LanguageLearning.API"
      Jwt__Audience: "LanguageLearning.Client"
      Jwt__SigningKey: "change-this-to-a-long-random-32-char-key"
      Database__ApplyMigrationsOnStartup: "false"
      Seeding__EnableDemoData: "false"
      Auth__BootstrapFirstUserAsAdmin: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LanguageLerning.slnx --ignore-failed-sources

      - name: Build
        run: dotnet build LanguageLerning.slnx --no-restore -p:UseSharedCompilation=false

      - name: Run regression tests
        run: dotnet run --project LanguageLerning.Tests/LanguageLerning.Tests.csproj --no-build

      - name: Migrations smoke check
        run: dotnet ef migrations list --project Infrastructure/Infrastructure.csproj --startup-project API/API.csproj --context LanguageLearningDbContext --no-build
